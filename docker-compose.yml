services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=minirpg
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--locale=C
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/minirpg
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:instruct
      - CONTEXT_WINDOW=12
      - TEMPERATURE=0.7
      - TOP_P=0.9
      - NODE_ENV=development
    ports:
      - '3001:3001'
    command: >-
      sh -c "pnpm -F @minimal-rpg/db db:migrate && pnpm -F @minimal-rpg/api dev"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - VITE_API_BASE_URL=http://192.168.0.62:3001
    ports:
      - '5173:5173'
    command: >-
      sh -c "pnpm -F @minimal-rpg/web dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
