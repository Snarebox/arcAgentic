version: "3.9"
services:
  api:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PORT=3001
      - DATABASE_URL=file:/app/packages/api/prisma/dev.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:instruct
      - CONTEXT_WINDOW=12
      - TEMPERATURE=0.7
      - TOP_P=0.9
    ports:
      - "3001:3001"
    command: >-
      sh -c "corepack enable && pnpm -w install && pnpm -w build && pnpm -F @minimal-rpg/api db:deploy && node packages/api/dist/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    ports:
      - "5173:5173"
    command: >-
      sh -c "corepack enable && pnpm -w install && pnpm -F @minimal-rpg/web dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
