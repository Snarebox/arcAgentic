app = "arcagentic"

[build]
	dockerfile = "Dockerfile.api"

[http_service]
	internal_port = 3001
	force_https = true
	auto_stop_machines = "stop"
	auto_start_machines = true
	min_machines_running = 0

	[http_service.concurrency]
		type = "requests"
		soft_limit = 50
		hard_limit = 100

	[[http_service.checks]]
		interval = "15s"
		timeout = "5s"
		grace_period = "20s"
		method = "GET"
		path = "/health"